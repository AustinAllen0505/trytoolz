<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestPylot Framework</title>

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.2/core.css">

    <!-- Custom Test Styles -->
    <link rel="stylesheet" href="lib/styles.css">

    <!-- PyScript JS -->
    <script type="module" src="https://pyscript.net/releases/2024.10.2/core.js"></script>

    <!-- Clear Pyodide Cache on Page Load -->
    <script>
        // Clear Pyodide's IndexedDB cache on every page load
        // This ensures students always get fresh code without manual cache clearing
        async function clearPyodideCache() {
            try {
                // Get all IndexedDB database names
                const dbs = await window.indexedDB.databases();

                // Delete all Pyodide-related databases
                for (const db of dbs) {
                    if (db.name && db.name.includes('pyodide')) {
                        window.indexedDB.deleteDatabase(db.name);
                        console.log(`Cleared Pyodide cache: ${db.name}`);
                    }
                }
            } catch (err) {
                // Silently fail if IndexedDB is not available or blocked
                console.log('Note: Could not clear Pyodide cache (IndexedDB may be disabled)');
            }
        }

        // Clear cache when page loads
        clearPyodideCache();
    </script>

    <!-- Toggle Function for Suite Collapse/Expand -->
    <script>
        function toggleSuite(suiteId) {
            // Find button by either data-suite-id or data-subsuite-id attribute
            const button = document.querySelector(`[data-suite-id="${suiteId}"], [data-subsuite-id="${suiteId}"]`);
            const content = document.getElementById(suiteId);

            // Guard against null elements
            if (!button || !content) {
                console.error(`Could not find button or content for ${suiteId}`);
                return;
            }

            const arrow = button.querySelector('.toggle-arrow');

            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                content.classList.add('expanded');
                button.classList.remove('collapsed');
                button.classList.add('expanded');
                arrow.textContent = '▼';
            } else {
                content.classList.add('collapsed');
                content.classList.remove('expanded');
                button.classList.add('collapsed');
                button.classList.remove('expanded');
                arrow.textContent = '▶';
            }
        }
    </script>
</head>
<body>
    <h1>TestPylot Framework</h1>
    <p style="color: #57606f; margin-bottom: 30px;">
        A browser-based Python testing framework for educational projects
    </p>

    <!-- Loading indicator -->
    <div id="loading" class="loading">
        Loading TestPylot tests
    </div>

    <!-- Test results will be rendered here -->
    <div id="test-results"></div>

    <!-- PyScript Configuration -->
    <py-config>
        packages = []

        [[fetch]]
        files = ["src/__init__.py", "src/main.py", "tests/__init__.py", "tests/test_framework.py", "tests/test_main.py"]
    </py-config>

    <!-- Main Test Runner Script -->
    <script type="py">
        import sys
        import importlib
        from js import document

        # Hide loading indicator
        loading_el = document.getElementById("loading")
        if loading_el:
            loading_el.style.display = "none"

        try:
            # Clear all cached modules to force fresh imports
            # This ensures changes to source files are picked up immediately
            modules_to_clear = [
                name for name in sys.modules.keys()
                if name.startswith('src.') or name.startswith('tests.')
            ]
            for module_name in modules_to_clear:
                del sys.modules[module_name]

            print(f"Cleared {len(modules_to_clear)} cached modules")

            # Import test framework
            from tests.test_framework import TestRunner, get_runner

            # Import test modules - they register themselves on import
            test_modules = []

            try:
                from tests import test_main
                test_modules.append(test_main)
            except ImportError as ie:
                print(f"test_main not found - skipping: {ie}")

            # Get the runner that tests registered with
            runner = get_runner()

            # Run all tests
            if runner and runner.test_suites:
                runner.run()
                runner.display_results("test-results")
            else:
                # No tests found, show placeholder message
                results_div = document.getElementById("test-results")
                results_div.innerHTML = """
                <div style="text-align: center; padding: 60px 20px; color: #57606f;">
                    <h2>No tests found</h2>
                    <p>Test files will appear here once they're created.</p>
                    <p style="margin-top: 20px; font-size: 0.9em;">
                        Expected test file: test_main.py
                    </p>
                </div>
                """

        except Exception as e:
            # Show error if something goes wrong
            import traceback
            error_name = type(e).__name__
            error_msg = str(e)
            error_trace = traceback.format_exc()

            results_div = document.getElementById("test-results")
            results_div.innerHTML = f"""
            <div style="background: #fff5f5; padding: 30px; border-radius: 8px; border-left: 5px solid #ff4757;">
                <h2 style="color: #ff4757; margin-top: 0;">Error Loading Tests</h2>
                <p><strong>{error_name}:</strong> {error_msg}</p>
                <pre style="background: #f1f2f6; padding: 15px; border-radius: 4px; overflow-x: auto;">
{error_trace}</pre>
            </div>
            """
    </script>
</body>
</html>
